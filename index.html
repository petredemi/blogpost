<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://malsup.github.io/jquery.form.js"></script> 
    <title>Blog Post</title>
</head>
<body>
<div class="app">
    <h2 style="margin-left: 20px; margin-bottom: 1px; width: fit-content;">Blog about european cuisine </h2>
    <div class="head">
        <div class="buttons">
            <button id="signup">sign up</button>
            <button id="login"> log in</button>
            <button id="logout">log out</button>
            <button id="addmessage">add post</button>
            <button id="uploadpic">profile picture</button>
        </div>

        <div class="personal">
            <div class="userpict">
                
            </div>
            <h5 id="logedin" ></h5>
        </div>
    </div>
    <div class="adduser">
        <div class="form">
                <label for="name" class="label">
                    name
                    <input type="text" name="name" id="name">
                </label>
                <label for="email" class="label">
                    email
                    <input type="email" name="email" id="email">
                </label>
                <label for="password" class="label">
                    pasword 
                    <input type="password" name="passw" id="passw">
                </label>
                <label for="profession" class="label">
                    profession 
                    <input type="text" name="profession" id="profession">
                </label>
                <label for="authorreq">
                    do you want to becomme be author
                    <input type="checkbox" name="authorreq" id="authorreq" value="yes">
                </label>
                <button type="submit" id="btnSignup">submit</button>
        </div>
    </div>
    <div class="loginuser">
        <div class="form">
            <li>
                <label for="logemail">email </label>
                <input type="email" name="logemail" id="logemail">
            </li>
            <li>
                <label for="loginPassw">password </label>
                <input type="password" name="loginPassw" id="loginPassw">
            </li>
            <button type="submit" id="btnlogin">submit</button>
        </div>
    </div>
    <div class="messagepost" >
        <div class="form">
            <label for="title">title</label>
            <input type="text" name="title" id="title"></label>
            <label for="mesg"></label>
            <textarea name="mesg" id="mesg"></textarea>
            <button type="submit" id="msgbtn" style="width: 60px; margin: 10px;">submit</button>
        </div>
    </div>
    <div class="uploadprofiles">
        <form class="uploadImage"  action="https://myblog-62pt.onrender.com/picture" method="post" enctype="multipart/form-data">
            <li style="font-size: 0.8rem;">max-size 1Mb, recomended dimension 200 x 200 px </li>
            <input type="file" name="profileimg"  id="profileimg"/>
            <input type="submit" value="upload img" class="uploadbtn">
        </form>    
    </div>
     <div class="requestsform">
            <div class="usersstatus"> </div>
    </div>
    <div class="allusers">
            <div class="users"></div>
    </div>
    <div class="messageslist"></div> 
    <div class="pictures">
        <div class="pic">
            <img src="picture/travelgoldengate.jpg" width="600" height="400" alt="">
        </div>
        <div class="pic">
            <img src="picture/travelseaandrock.jpg" width="600" height="400" alt="">
        </div>
        <div class="pic">
            <img src="picture/travelgreece.jpg" width="600" height="400" alt="">
        </div>
        <div class="pic">
            <img src="picture/ligthonwall.jpg" width="600" height="400" alt="">
        </div>
    </div>
   
</div>  
</body>
</html>
